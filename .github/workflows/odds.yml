name: Aggiorna quote NBA
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
permissions:
  contents: write
concurrency:
  group: nba-stats-sync
  cancel-in-progress: false
jobs:
  odds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recupera quote
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
        run: python3 sync_odds.py
      - name: Pubblica archivio quote
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/odds.json
          git diff --cached --quiet && exit 0
          git commit -m 'Aggiorna quote NBA'
          git pull --rebase
          git push
